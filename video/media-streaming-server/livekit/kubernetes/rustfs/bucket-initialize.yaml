---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-initialize
  namespace: livekit
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rustfs
          image: docker.io/curlimages/curl:8.19.0
          command:
            - sh
            - -c
            - 'until curl --silent --fail --max-time 5 http://rustfs-svc:9000/health; do sleep 2; done'
      containers:
        - name: rustfs-bucket-initialize
          image: docker.io/amazon/aws-cli:2.34.32
          env:
            - name: AWS_ACCESS_KEY_ID
              value: rustfs_admin
            - name: AWS_SECRET_ACCESS_KEY
              value: passw0rd
            - name: AWS_DEFAULT_REGION
              value: us-west-2
          command:
            - sh
            - -c
            - >-
              aws --endpoint-url http://rustfs-svc:9000 s3 mb s3://livekit-hls || true;
              aws --endpoint-url http://rustfs-svc:9000 s3api put-bucket-policy
              --bucket livekit-hls
              --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::livekit-hls/*"}]}';
              aws --endpoint-url http://rustfs-svc:9000 s3api put-bucket-lifecycle-configuration
              --bucket livekit-hls
              --lifecycle-configuration '{"Rules":[{"ID":"expire-hls-sessions","Status":"Enabled","Filter":{"Prefix":"stream/"},"Expiration":{"Days":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}'
