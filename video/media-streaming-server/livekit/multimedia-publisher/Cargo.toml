[package]
name = "multimedia-publisher"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
dotenvy = "=0.15.7"
livekit = "=0.8.2"
livekit-api = "=0.6.2"
livekit-protocol = "=0.7.12"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["v4"] }
