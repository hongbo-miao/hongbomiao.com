# Ubuntu's strongswan-swanctl / charon-systemd packages ship strongSwan compiled with more
# plugins than they package .so files for -- af-alg, ccm, chapoly, cmac, ctr, curl, curve25519,
# gcrypt, ldap, ntru, pkcs11, and test-vectors have no plugin file at all, so charon and swanctl
# log a "failed to load" warning for each of them on every run. None of them are needed for a PSK
# tunnel using aes256-sha256-modp2048, so disable them explicitly to keep the logs readable.
charon {
  plugins {
    af-alg { load = no }
    ccm { load = no }
    chapoly { load = no }
    cmac { load = no }
    ctr { load = no }
    curl { load = no }
    curve25519 { load = no }
    gcrypt { load = no }
    ldap { load = no }
    ntru { load = no }
    pkcs11 { load = no }
    test-vectors { load = no }
  }
}
swanctl {
  plugins {
    af-alg { load = no }
    ccm { load = no }
    chapoly { load = no }
    cmac { load = no }
    ctr { load = no }
    curl { load = no }
    curve25519 { load = no }
    gcrypt { load = no }
    ldap { load = no }
    ntru { load = no }
    pkcs11 { load = no }
    test-vectors { load = no }
  }
}
