connections {
  site-to-site {
    version = 2
    local_addrs = 198.51.100.20
    remote_addrs = 198.51.100.10

    # IKE_SA (phase 1) proposal.
    proposals = aes256-sha256-modp2048
    encap = yes # force UDP/4500 encapsulation, since bare ESP (IP protocol 50) is not reliably carried over Docker bridge networking

    local {
      auth = psk
      id = 198.51.100.20
    }
    remote {
      auth = psk
      id = 198.51.100.10
    }

    children {
      lan {
        local_ts = 10.10.0.0/24
        remote_ts = 10.20.0.0/24

        # CHILD_SA (phase 2) proposal. modp2048 is Diffie-Hellman group 14 -- including a DH group
        # here is what turns on perfect forward secrecy for phase 2.
        esp_proposals = aes256-sha256-modp2048

        start_action = start # the on-premises side dials
      }
    }
  }
}

secrets {
  ike-site-to-site {
    id-local = 198.51.100.20
    id-remote = 198.51.100.10
    secret = "example-pre-shared-key-not-a-real-secret"
  }
}
