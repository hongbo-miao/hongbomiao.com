# Based on the doris-disaggregated chart's fe-configmap.yaml template, with the JVM heap sized
# down from the chart default (8192m) to fit a laptop-sized kind node.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-configmap
  namespace: data-pipeline
data:
  fe.conf: |
    CUR_DATE=`date +%Y%m%d-%H%M%S`
    LOG_DIR = ${DORIS_HOME}/log
    JAVA_OPTS_FOR_JDK_17="-Djavax.security.auth.useSubjectCredsOnly=false -Xmx1536m -Xms1536m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$LOG_DIR -Xlog:gc*:$LOG_DIR/fe.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal.ref=ALL-UNNAMED"
    sys_log_level = INFO
    sys_log_mode = NORMAL
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    enable_fqdn_mode = true
