---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oxia-coordinator-config
  namespace: data-pipeline
data:
  config.yaml: |
    namespaces:
      - name: default
        initialShardCount: 1
        replicationFactor: 1
      - name: broker
        initialShardCount: 1
        replicationFactor: 1
      - name: bookkeeper
        initialShardCount: 1
        replicationFactor: 1
    servers:
      # internal is the coordinator-to-server control channel only, never handed to clients,
      # so it stays a pod-local address.
      - public: oxia-config-store.data-pipeline.svc.cluster.local:6648
        internal: pulsar-oxia-server-0.pulsar-oxia-svc:6649
    # Oxia rejects a bootstrap connection whose authority is neither listed here nor a
    # configured public address. West's own bookies and brokers arrive via pulsar-oxia-svc,
    # east's brokers via oxia-config-store.
    allowExtraAuthorities:
      - pulsar-oxia-svc:6648
      - pulsar-oxia-svc.data-pipeline.svc.cluster.local:6648
      - pulsar-oxia:6648
      - pulsar-oxia.data-pipeline.svc.cluster.local:6648
      - oxia-config-store:6648
      - oxia-config-store.data-pipeline.svc.cluster.local:6648
