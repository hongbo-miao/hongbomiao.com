# https://charts.selectdb.com/doris-foundationdb-25.8.0.tgz values.yaml
#
# Chart defaults to FDB 7.1.38 (amd64-only). Doris 4.1.3's meta service links both a 7.1.57 and
# a 7.3.69 FDB client, so pinning the server to 7.3.79 (latest 7.3.x, arm64 present since
# 7.3.63) lets everything run native on an arm64 host.
#
# redundancy_mode is trimmed from the reference lab's "double" to "single", and resource
# requests are halved, since this lab runs two full FDB+Doris stacks at once (one per cloud)
# rather than one. processCounts stays at 1 log + 2 storage: the operator hardcodes a minimum
# of 3 coordinator-eligible processes regardless of redundancy_mode, and 1 log + 1 storage
# (2 total) fails reconciliation with "cannot find enough running Pods to recruit
# coordinators. Require 3, got 2 Pods".
---
# FoundationDBCluster name; the operator derives the connection ConfigMap as "<name>-config",
# referenced from kubernetes/doris/disaggregated-cluster.yaml's metaService.fdb.configMapNamespaceName.
name: doris-fdb

redundancy_mode: single

foundatinondbImage:
  repository: foundationdb/foundationdb
  tag: 7.3.79
  version: 7.3.79

foundationdbSidecarImage:
  repository: foundationdb/foundationdb-kubernetes-sidecar
  tag: 7.4.6-1

processCounts:
  cluster_controller: 1
  log: 1
  storage: 2
  stateless: -1

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

volumeClaimTemplate:
  spec:
    resources:
      requests:
        storage: 5Gi

fdb-operator:
  # Chart bundles fdb-operator v2.3.0, which is amd64-only. v2.8.0 is the first arm64 tag;
  # v2.34.0 is latest. The CRDs applied via kubernetes/foundationdb/crds are also v2.34.0, so
  # controller and schema stay in lockstep.
  image:
    repository: foundationdb/fdb-kubernetes-operator
    tag: v2.34.0
  # Helm merges map overrides key-by-key rather than replacing them, so the chart's amd64-only
  # 6.2/6.3/7.1 init container entries have to be nulled out explicitly, or the operator pod
  # pulls and runs all four under emulation instead of just the one FDB 7.3 actually needs.
  initContainers:
    "6.2": null
    "6.3": null
    "7.1": null
    "7.3":
      image:
        repository: foundationdb/foundationdb-kubernetes-sidecar
        tag: 7.4.6-1
