# Simulates a human-facing entry point in front of both clouds' sensor-gateways, the same
# HAProxy-as-pretend-Cloudflare-LB pattern used in cloud-platform/cilium/cluster-mesh.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend sensor_edge
    bind *:80
    default_backend sensor_gateway_pool

backend sensor_gateway_pool
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2
    server west data-pipeline-west-worker:30090
    server east data-pipeline-east-worker:30090

listen hm_stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
