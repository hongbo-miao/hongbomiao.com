# Simulated Cloudflare Load Balancer.
#
# Cloudflare Load Balancing concept  ->  HAProxy equivalent used below
#   pool / origin                    ->  server line
#   health monitor                   ->  option httpchk + default-server check inter/fall/rise
#   failover pool priority           ->  server ... backup
#   weighted or random steering      ->  balance roundrobin + weight
#   session affinity                 ->  cookie / stick table (not enabled here)
#
# Cloudflare's anycast edge and geo/proximity steering cannot be reproduced locally --
# only the decision logic is simulated. Backends are addressed by kind node container
# name, which docker resolves on the shared "kind" bridge network.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    # The origin otherwise sees the edge's IP as the client. Cloudflare solves this with
    # X-Forwarded-For and CF-Connecting-IP; this is the same idea.
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend hm_edge
    bind *:80
    default_backend hm_cluster_pool

backend hm_cluster_pool
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    # inter 2s / fall 3 means an unhealthy cluster is ejected after ~6 seconds, which is
    # deliberately far slower than the millisecond failover Cilium does inside the mesh.
    default-server check inter 2s fall 3 rise 2
    server west cilium-cluster-mesh-west-worker:30080
    server east cilium-cluster-mesh-east-worker:30080
    # To model a Cloudflare failover pool order instead of active/active steering,
    # mark the secondary cluster as a backup:
    #   server east cilium-cluster-mesh-east-worker:30080 backup

listen hm_stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
