[project]
name = "hm-flax"
version = "1.0.0"
requires-python = "==3.13.15"
dependencies = [
  "flax==0.12.8",
  "jax==0.10.2",
  "optax==0.2.8",
]

[dependency-groups]
dev = [
  "poethepoet==0.48.0",
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.11.0"

[tool.poe.tasks]
dev = "python src/main.py"
test = "pytest --verbose --verbose"
test-coverage = "pytest --cov=. --cov-report=xml"
