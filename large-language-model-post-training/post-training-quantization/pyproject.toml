[project]
name = "post-training-quantization"
version = "1.0.0"
requires-python = "==3.14.7"
dependencies = [
  "segment-anything-py==1.0.1",
  "torch==2.12.1",
  "torchao==0.17.0",
]

[dependency-groups]
dev = [
  "poethepoet==0.48.0",
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.11.0"

[tool.poe.tasks]
dev = "python src/main.py"
test = "pytest --verbose --verbose"
test-coverage = "pytest --cov=. --cov-report=xml"
