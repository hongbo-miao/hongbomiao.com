[project]
name = "process-flight-data"
version = "1.0.0"
requires-python = "==3.14.7"
dependencies = [
  "mlflow==3.13.0",
  "polars==1.41.2",
  "pydantic-settings==2.14.2",
  "ray[default]==2.55.1",
]

[dependency-groups]
dev = [
  "poethepoet==0.48.0",
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.11.0"

[tool.poe.tasks]
submit = "python src/submit.py"
test = "pytest --verbose --verbose"
test-coverage = "pytest --cov=. --cov-report=xml"
