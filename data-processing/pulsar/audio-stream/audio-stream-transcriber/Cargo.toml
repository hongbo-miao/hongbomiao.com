[package]
name = "audio-stream-transcriber"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
apache-avro = "=0.21.0"
dotenvy = "=0.15.7"
futures = "=0.3.33"
livekit = "=0.7.53"
livekit-api = "=0.5.6"
opus = "=0.3.1"
prost = "=0.14.4"
pulsar = "=6.8.0"
serde_json = "=1.0.151"
sherpa-onnx = "=1.13.4"
text-processing-rs = "=0.2.2"
tokio = { version = "=1.52.4", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[build-dependencies]
prost-build = "=0.14.4"
