---
apiVersion: batch/v1
kind: Job
metadata:
  name: knowledge-base-loader
  namespace: stream-ai-inference
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: knowledge-base-loader
          image: stream-ai-inference
          # KnowledgeBaseLoader runs as a bare `java` process, not through Flink's own launcher, so
          # it needs Flink's lib/ on the classpath itself for the slf4j/log4j binding the shaded
          # job jar deliberately excludes (the Flink job gets those from the same lib/ directory
          # via its parent classloader instead).
          command:
            - sh
            - -c
            - >-
              java
              --add-opens=java.base/java.nio=ALL-UNNAMED
              --add-opens=java.base/java.util=ALL-UNNAMED
              -cp "/opt/flink/lib/*:/opt/flink/usrlib/flink-stream-ai-inference-0.1.jar"
              com.hongbomiao.KnowledgeBaseLoader
          env:
            - name: KNOWLEDGE_BASE_PATH
              value: /opt/flink/knowledge-base/knowledge-base.json
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_EMBEDDING_MODEL
              value: all-minilm:22m
            - name: EMBEDDING_DIMENSION
              value: '384'
            - name: KNOWLEDGE_BASE_DATASET_URI
              value: s3://vector-store/knowledge-base.lance
            - name: S3_ENDPOINT
              value: http://rustfs-svc:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
