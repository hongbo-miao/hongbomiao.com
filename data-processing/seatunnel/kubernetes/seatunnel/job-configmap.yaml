---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seatunnel-job-config
  namespace: seatunnel
data:
  postgres-to-paimon.conf: |
    env {
      parallelism = 1
      job.mode = "BATCH"
    }

    source {
      Jdbc {
        url = "jdbc:postgresql://postgres-postgresql:5432/postgres"
        driver = "org.postgresql.Driver"
        user = "postgres"
        password = "postgres_password"
        query = "SELECT id, name, email, created_at FROM users"
      }
    }

    sink {
      Paimon {
        warehouse = "s3a://paimon-bucket/paimon"
        database = "default"
        table = "users"
        paimon.build.option = {
          "fs.s3a.endpoint" = "http://rustfs-svc:9000"
          "fs.s3a.access-key" = "rustfs_admin"
          "fs.s3a.secret-key" = "rustfs_passw0rd"
          "fs.s3a.path.style.access" = "true"
          "fs.s3a.impl" = "org.apache.hadoop.fs.s3a.S3AFileSystem"
          "fs.s3a.aws.credentials.provider" = "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
          "s3.endpoint" = "http://rustfs-svc:9000"
          "s3.access-key" = "rustfs_admin"
          "s3.secret-key" = "rustfs_passw0rd"
          "s3.path-style-access" = "true"
        }
      }
    }
