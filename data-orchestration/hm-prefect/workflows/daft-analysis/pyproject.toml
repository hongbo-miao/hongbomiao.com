[project]
name = "prefect-daft-analysis"
version = "1.0.0"
requires-python = "==3.13.15"
dependencies = [
  "daft[aws,deltalake,ray]==0.7.24",
  "prefect-client==3.7.8",
  "prefect==3.7.8",
]

[dependency-groups]
dev = [
  "poethepoet==0.48.0",
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
]

[tool.poe.tasks]
dev = "python src/main.py"
test = "pytest --verbose --verbose"
test-coverage = "pytest --cov=. --cov-report=xml"
deploy = "python src/deploy.py"
run = "prefect deployment run"
