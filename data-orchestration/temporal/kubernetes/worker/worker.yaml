---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: hm-recording-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: worker
          env:
            - name: TEMPORAL_SERVER_URL
              value: http://temporal-frontend.hm-temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: recording-report
