# Hand-written rather than rendered from the doris-disaggregated chart: that chart's
# be-configmap.yaml hardcodes a 100Gi file cache with no values override, which cannot fit a
# kind-sized PVC. The doris-operator chart still supplies the CRD and controller; only this CR
# and its ConfigMaps (fe-configmap.yaml, be-configmap.yaml, ms-configmap.yaml) are plain
# manifests. Field shapes verified against
# doris-operator/crds/disaggregated.cluster.doris.com_dorisdisaggregatedclusters.yaml.
---
apiVersion: disaggregated.cluster.doris.com/v1
kind: DorisDisaggregatedCluster
metadata:
  name: doris
  namespace: doris
spec:
  metaService:
    image: apache/doris:ms-4.1.3
    replicas: 2
    fdb:
      configMapNamespaceName:
        name: doris-fdb-config
        namespace: foundationdb
    configMaps:
      - name: ms-configmap
        mountPath: /etc/doris
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 1Gi
  feSpec:
    replicas: 1
    electionNumber: 1
    image: apache/doris:fe-4.1.3
    configMaps:
      - name: fe-configmap
        mountPath: /etc/doris
    logNotStore: false
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi
    persistentVolumes:
      - persistentVolumeClaimSpec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  computeGroups:
    - uniqueId: application_a
      replicas: 2
      image: apache/doris:be-4.1.3
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 2Gi
      configMaps:
        - name: be-configmap
          mountPath: /etc/doris
      logNotStore: false
      persistentVolumes:
        - persistentVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
    - uniqueId: application_b
      replicas: 2
      image: apache/doris:be-4.1.3
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 2Gi
      configMaps:
        - name: be-configmap
          mountPath: /etc/doris
      logNotStore: false
      persistentVolumes:
        - persistentVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
