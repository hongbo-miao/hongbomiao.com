---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-initialize
  namespace: storage-compute-decoupled
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rustfs
          image: docker.io/curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - 'until curl --silent --fail --max-time 5 http://rustfs-svc:9000/health; do sleep 2; done'
      containers:
        - name: rustfs-bucket-initialize
          image: docker.io/amazon/aws-cli:2.36.25
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: us-west-2
          command:
            - sh
            - -c
            - >-
              aws --endpoint-url http://rustfs-svc:9000 s3 mb s3://doris-storage-vault || true;
              aws --endpoint-url http://rustfs-svc:9000 s3 mb s3://paimon-warehouse || true;
              aws --endpoint-url http://rustfs-svc:9000 s3 mb s3://flink-checkpoints || true
