[project]
name = "write-to-delta-lake"
version = "1.0.0"
requires-python = "==3.14.7"
dependencies = [
  "deltalake[pandas]==1.6.3",
  "pyarrow==24.0.0",
  "pydantic-settings==2.14.2",
]

[dependency-groups]
dev = [
  "poethepoet==0.48.0",
  "pytest-cov==7.1.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.11.0"

[tool.poe.tasks]
dev = "python src/main.py"
test = "pytest --verbose --verbose"
test-coverage = "pytest --cov=. --cov-report=xml"
