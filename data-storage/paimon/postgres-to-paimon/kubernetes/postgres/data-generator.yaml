---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-data-generator
  namespace: postgres-to-paimon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-data-generator
  template:
    metadata:
      labels:
        app: postgres-data-generator
    spec:
      containers:
        - name: postgres-data-generator
          image: docker.io/postgres:18.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Resume from the highest existing id so a pod restart doesn't replay ids
              # that are already there and fail on the primary key.
              id=$(psql "postgresql://postgres_admin:passw0rd@postgres:5432/customer_db" \
                --tuples-only --no-align \
                -c "select greatest((select coalesce(max(id), 0) from public.customers), (select coalesce(max(id), 0) from public.orders)) + 1;")
              while true; do
                psql "postgresql://postgres_admin:passw0rd@postgres:5432/customer_db" \
                  -c "insert into public.customers (id, name, email) values ($id, 'Generated $id', 'generated-$id@example.com');" \
                  -c "insert into public.orders (id, customer_id, amount, status) values ($id, $id, $id % 1000 + 0.99, 'pending');"
                id=$((id + 1))
                sleep 1
              done
